services:
  copy-trader:
    build:
      context: .
      args:
        INSTALL_TELEGRAM: ${INSTALL_TELEGRAM:-true}
        BUILD_ID: ${BUILD_ID:-local}
    container_name: hyperliquid-copy-trader
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
      # 不要在这里硬编码业务开关：compose 的 environment 优先级高于 .env，
      # 写死一个值会让 .env 里同名的配置静默失效（曾出现 FILL_POLLING_ENABLED）。
