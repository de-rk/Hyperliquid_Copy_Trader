services:
  copy-trader:
    build:
      context: .
      args:
        INSTALL_TELEGRAM: ${INSTALL_TELEGRAM:-true}
    container_name: hyperliquid-copy-trader
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
      - FILL_POLLING_ENABLED=false
